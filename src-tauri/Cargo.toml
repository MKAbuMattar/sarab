[package]
name = "sarab"
version = "0.0.3"
edition = "2021"
description = "Animated desktop wallpapers that rest when you work"
license = "GPL-3.0-only"
homepage = "https://sarab.mkabumattar.com"
repository = "https://github.com/MKAbuMattar/sarab"
authors = ["MKAbuMattar"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-autostart = "2.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows-version = "0.100.0"
windows = { version = "0.62.2", features = [
  "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm", "Win32_System_Com", "Win32_System_Power", "Win32_System_Threading",
  "Win32_System_RemoteDesktop", "Win32_System_StationsAndDesktops", "Win32_System_SystemServices",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
