[package]
name = "sarab"
version = "0.0.12"
edition = "2021"
description = "Animated desktop wallpapers that rest when you work"
license = "GPL-3.0-only"
homepage = "https://sarab.mkabumattar.com"
repository = "https://github.com/MKAbuMattar/sarab"
authors = ["MKAbuMattar"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-autostart = "2.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
# Already in the tree through the updater; same features, so there is one HTTP and TLS stack.
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring"] }
sha2 = "0.11.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tauri-plugin-updater = "2.13.1"

[target.'cfg(target_os = "linux")'.dependencies]
gdk = "0.18"
glib = "0.18"
gtk = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_5"] }
# Already in the tree through Tauri's WebKitGTK and tao; named here to call them directly.
webkit2gtk = "2.0.2"
x11-dl = "2.21.0"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows-version = "0.100.0"
windows = { version = "0.62.2", features = [
  "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm", "Win32_System_Com", "Win32_System_Power", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security",
  "Win32_System_RemoteDesktop", "Win32_System_StationsAndDesktops", "Win32_System_SystemServices", "Win32_System_SystemInformation",
  "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Performance",
  "Win32_System_Com_StructuredStorage", "Win32_System_Variant",
  "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_System_Registry", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_LibraryLoader",
  "Media_Control", "Foundation", "Storage_Streams", "Win32_Graphics_Imaging", "Win32_UI_Input_KeyboardAndMouse",
  "UI_Notifications", "Data_Xml_Dom", "Storage", "System_UserProfile",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
