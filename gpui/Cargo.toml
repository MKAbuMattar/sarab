[package]
name = "sarab-gpui"
version = "0.0.4"
edition = "2024"
description = "Animated desktop wallpapers that rest when you work"
license = "GPL-3.0-only"
homepage = "https://github.com/MKAbuMattar/sarab"
repository = "https://github.com/MKAbuMattar/sarab"
authors = ["MKAbuMattar"]
publish = false

[[bin]]
name = "sarab"
path = "src/main.rs"

[dependencies]
gpui-kit = "=0.7.0"
wry = "0.57.0"
tray-icon = "0.26.0"
minisign-verify = "0.3.0"
futures = "0.3.34"
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring"] }
sha2 = "0.11.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
ar-reshaper = "1.5.0"
unicode-bidi = "0.3.18"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows-version = "0.100.0"
windows = { version = "0.62.2", features = [
  "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm", "Win32_System_Com", "Win32_System_Power", "Win32_System_Threading",
  "Win32_System_RemoteDesktop", "Win32_System_StationsAndDesktops", "Win32_System_SystemServices",
  "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_IO",
  "Win32_System_Registry", "UI_Notifications", "Data_Xml_Dom",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
embed-resource = "3.0.11"
