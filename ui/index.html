<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sarab</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav aria-label="Sarab">
  <div class="brand">
    <img src="logo.png" alt="">
    <div><strong>Sarab</strong><span data-t="app.tagline"></span></div>
  </div>
  <button class="nav-item" data-page="library"><i class="icon" aria-hidden="true">&#xE8F1;</i><span data-t="nav.library"></span></button>
  <div class="nav-spacer"></div>
  <button class="nav-item" id="pause"><i class="icon" id="pause-icon" aria-hidden="true"></i><span id="pause-text"></span></button>
  <button class="nav-item" data-page="settings"><i class="icon" aria-hidden="true">&#xE713;</i><span data-t="nav.settings"></span></button>
  <button class="nav-item" data-page="about"><i class="icon" aria-hidden="true">&#xE946;</i><span data-t="nav.about"></span></button>
</nav>

<main>
  <div id="error" class="infobar" role="alert" hidden><i class="icon" aria-hidden="true">&#xEA39;</i><span id="error-text"></span></div>

  <section class="page" id="page-library" aria-labelledby="h-library">
    <h1 id="h-library" data-t="library.title"></h1>
    <div class="desk-card">
      <div class="row between">
        <h2 data-t="displays.title"></h2>
        <button type="button" id="all-displays" class="subtle" aria-pressed="false"><i class="icon" aria-hidden="true">&#xE7F4;</i><span data-t="displays.all"></span></button>
      </div>
      <div id="monitors" class="monitors" role="group" data-tl="displays.title"></div>
      <div id="detail" class="detail"></div>
    </div>
    <form id="add" class="row add">
      <input id="target" class="grow" type="text" required data-tp="add.placeholder" autocomplete="off">
      <button class="accent"><i class="icon" aria-hidden="true">&#xE710;</i><span data-t="add.button"></span></button>
    </form>
    <p class="caption" data-t="add.hint"></p>
    <p id="lib-empty" class="empty" data-t="library.empty" hidden></p>
    <ul id="library" class="tiles"></ul>
  </section>

  <section class="page" id="page-settings" aria-labelledby="h-settings" hidden>
    <h1 id="h-settings" data-t="settings.title"></h1>
    <form id="settings">
      <h2 data-t="settings.appearance"></h2>
      <label class="card"><i class="icon" aria-hidden="true">&#xE790;</i><span class="title" data-t="settings.theme"></span>
        <select name="theme"><option value="system" data-t="theme.system"></option><option value="light" data-t="theme.light"></option><option value="dark" data-t="theme.dark"></option></select></label>
      <label class="card"><i class="icon" aria-hidden="true">&#xF5EF;</i><span><span class="title" data-t="settings.backdrop"></span><br><span class="caption" data-t="settings.backdropDesc"></span></span>
        <select name="backdrop"><option value="acrylic" data-t="backdrop.acrylic"></option><option value="mica" data-t="backdrop.mica"></option><option value="solid" data-t="backdrop.solid"></option></select></label>
      <label class="card"><i class="icon" aria-hidden="true">&#xE8C1;</i><span class="title" data-t="settings.language"></span>
        <select name="language"><option value="en">English</option><option value="ar">العربية</option></select></label>

      <h2 data-t="settings.pausing"></h2>
      <label class="card"><i class="icon" aria-hidden="true">&#xE740;</i><span><span class="title" data-t="settings.pauseFullscreen"></span><br><span class="caption" data-t="settings.pauseFullscreenDesc"></span></span><input class="switch" type="checkbox" name="pause_fullscreen"></label>
      <label class="card sub"><span></span><span class="title" data-t="settings.perDisplay"></span><input class="switch" type="checkbox" name="per_display"></label>
      <label class="card"><i class="icon" aria-hidden="true">&#xE8A7;</i><span class="title" data-t="settings.pauseFocus"></span><input class="switch" type="checkbox" name="pause_focus"></label>
      <label class="card"><i class="icon" aria-hidden="true">&#xEBA7;</i><span class="title" data-t="settings.pauseBattery"></span><input class="switch" type="checkbox" name="pause_battery"></label>
      <label class="card"><i class="icon" aria-hidden="true">&#xEC48;</i><span class="title" data-t="settings.pausePowerSaver"></span><input class="switch" type="checkbox" name="pause_power_saver"></label>
      <label class="card"><i class="icon" aria-hidden="true">&#xE8AF;</i><span class="title" data-t="settings.pauseRemote"></span><input class="switch" type="checkbox" name="pause_remote"></label>

      <h2 data-t="settings.performance"></h2>
      <label class="card"><i class="icon" aria-hidden="true">&#xEC4A;</i><span><span class="title" data-t="settings.fps"></span><br><span class="caption" data-t="settings.fpsDesc"></span></span>
        <select name="fps"><option value="15">15</option><option value="30">30</option><option value="60">60</option><option value="0" data-t="settings.fpsUnlimited"></option></select></label>
      <label class="card"><i class="icon" aria-hidden="true">&#xE767;</i><span class="title" data-t="settings.volume"></span><input type="range" name="volume" min="0" max="100" step="1"></label>

      <h2 data-t="settings.apps"></h2>
      <label class="card stack"><i class="icon" aria-hidden="true">&#xE769;</i><span class="title" data-t="settings.appPause"></span><textarea name="app_pause" rows="2" spellcheck="false"></textarea></label>
      <label class="card stack"><i class="icon" aria-hidden="true">&#xE768;</i><span class="title" data-t="settings.appPlay"></span><textarea name="app_play" rows="2" spellcheck="false"></textarea></label>

      <h2 data-t="settings.startup"></h2>
      <label class="card"><i class="icon" aria-hidden="true">&#xE7E8;</i><span class="title" data-t="settings.autostart"></span><input class="switch" type="checkbox" id="autostart"></label>
    </form>
  </section>
  <section class="page" id="page-about" aria-labelledby="h-about" hidden>
    <h1 id="h-about" data-t="about.title"></h1>
    <div class="about-hero">
      <img src="logo.png" alt="" width="64" height="64">
      <div>
        <strong class="about-name">Sarab <span class="about-ar" lang="ar">سراب</span></strong>
        <span id="about-version" class="caption"></span>
        <span class="caption" data-t="app.tagline"></span>
      </div>
    </div>
    <p class="about-text" data-t="about.description"></p>
    <h2 data-t="about.details"></h2>
    <div class="card"><i class="icon" aria-hidden="true">&#xE8A5;</i><span class="title" data-t="about.license"></span><span class="caption">GNU GPL v3</span></div>
    <div class="card"><i class="icon" aria-hidden="true">&#xE790;</i><span><span class="title" data-t="about.colors"></span><br><span class="caption" data-t="about.colorsDesc"></span></span><span class="swatches" aria-hidden="true"><i style="background:#2B2233"></i><i style="background:#D9A36A"></i><i style="background:#2F5D6B"></i><i style="background:#8B1E2D"></i><i style="background:#6B7A4F"></i></span></div>
    <div class="card"><i class="icon" aria-hidden="true">&#xE774;</i><span class="title" data-t="about.webview"></span><span id="about-webview" class="caption"></span></div>
    <div class="card"><i class="icon" aria-hidden="true">&#xE71B;</i><span><span class="title" data-t="about.website"></span><br><span class="caption">sarab.mkabumattar.com</span></span><button type="button" data-open="website"><span data-t="about.visit"></span></button></div>
    <div class="card"><i class="icon" aria-hidden="true">&#xEBE8;</i><span><span class="title" data-t="about.report"></span><br><span class="caption" data-t="about.reportDesc"></span></span><button type="button" data-open="issues"><span data-t="about.visit"></span></button></div>
    <h2 data-t="about.folders"></h2>
    <div class="card"><i class="icon" aria-hidden="true">&#xE8B7;</i><span><span class="title" data-t="about.config"></span><br><span class="caption" data-t="about.configDesc"></span></span><button type="button" data-open="config"><span data-t="about.open"></span></button></div>
    <div class="card"><i class="icon" aria-hidden="true">&#xE8F1;</i><span class="title" data-t="about.library"></span><button type="button" data-open="library"><span data-t="about.open"></span></button></div>
  </section>
</main>

<dialog id="props">
  <form method="dialog">
    <div class="content"><h2 data-t="props.title"></h2><div id="props-body"></div></div>
    <div class="footer"><button class="accent" data-t="props.close"></button></div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
