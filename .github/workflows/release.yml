name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag matches the version
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $cargo = [regex]::Match((Get-Content src-tauri/Cargo.toml -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $cargo -or $tag -ne $conf) { throw "tag $tag, Cargo.toml $cargo, tauri.conf.json $conf" }
          "VERSION=$tag" >> $env:GITHUB_ENV

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Test
        working-directory: src-tauri
        run: cargo test --locked

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-binstall

      - name: Install Tauri CLI
        run: cargo binstall -y --locked "tauri-cli@2.12.1"

      # Signs the installer for the in-app updater. Add both secrets under Settings > Secrets and variables > Actions.
      - name: Build installer
        working-directory: src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build

      - name: Release notes from the changelog
        run: |
          $log = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?ms)^## \[$([regex]::Escape($env:VERSION))\][^\n]*\n(.*?)(?=^## \[|\z)")
          if (-not $m.Success) { throw "CHANGELOG.md has no section for $env:VERSION" }
          $notes = $m.Groups[1].Value.Trim()
          $notes | Set-Content notes.md
          # The feed the in-app updater reads: releases/latest/download/latest.json.
          $exe = "Sarab_$($env:VERSION)_x64-setup.exe"
          $sig = (Get-Content "src-tauri/target/release/bundle/nsis/$exe.sig" -Raw).Trim()
          @{ version = $env:VERSION; notes = $notes; pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
             platforms = @{ 'windows-x86_64' = @{ signature = $sig; url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$exe" } } } |
            ConvertTo-Json -Depth 5 | Set-Content latest.json

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Sarab ${{ env.VERSION }}
          body_path: notes.md
          # A tag like v0.0.7-beta.1 is a prerelease, which the stable feed (releases/latest) skips.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            latest.json
          fail_on_unmatched_files: true

      # The beta feed lives on a fixed `beta` release. Every release refreshes it, so the beta
      # channel gets stable releases too.
      - name: Refresh the beta feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view beta --repo ${{ github.repository }} *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create beta --repo ${{ github.repository }} --prerelease --title "Beta feed" --notes "The update feed for the beta channel. Install from the versioned releases."
          }
          gh release upload beta latest.json --clobber --repo ${{ github.repository }}

  winget:
    name: Submit to winget
    needs: windows
    # winget gets full releases only.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-binstall

      - name: Install Komac
        run: cargo binstall -y --locked "komac@2.16.0"

      # Opens the update pull request on microsoft/winget-pkgs from the maintainer's fork.
      # WINGET_TOKEN is a classic token with the public_repo scope: the workflow's own token
      # cannot open pull requests on another organization's repository.
      - name: Open the winget update pull request
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:GITHUB_TOKEN) {
            "::notice::WINGET_TOKEN is not set, so no winget pull request was opened."
            exit 0
          }
          $version = "${{ github.ref_name }}".TrimStart('v')
          $base = "https://github.com/${{ github.repository }}/releases"
          komac sync
          komac update MKAbuMattar.Sarab --version $version `
            --urls "$base/download/${{ github.ref_name }}/Sarab_${version}_x64-setup.exe" `
            --release-notes-url "$base/tag/${{ github.ref_name }}" `
            --submit
