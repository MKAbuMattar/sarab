name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag matches the version
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $cargo = [regex]::Match((Get-Content src-tauri/Cargo.toml -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $cargo -or $tag -ne $conf) { throw "tag $tag, Cargo.toml $cargo, tauri.conf.json $conf" }
          "VERSION=$tag" >> $env:GITHUB_ENV

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Test
        working-directory: src-tauri
        run: cargo test --locked

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-binstall

      - name: Install Tauri CLI
        run: cargo binstall -y --locked "tauri-cli@2.12.1"

      - name: Build installer
        working-directory: src-tauri
        run: cargo tauri build

      - name: Release notes from the changelog
        run: |
          $log = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?ms)^## \[$([regex]::Escape($env:VERSION))\][^\n]*\n(.*?)(?=^## \[|\z)")
          if (-not $m.Success) { throw "CHANGELOG.md has no section for $env:VERSION" }
          $m.Groups[1].Value.Trim() | Set-Content notes.md

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Sarab ${{ env.VERSION }}
          body_path: notes.md
          prerelease: ${{ startsWith(env.VERSION, '0.') }}
          files: src-tauri/target/release/bundle/nsis/*-setup.exe
          fail_on_unmatched_files: true
