name: Release

on:
  push:
    tags: ["v*"]
  # A dry run builds and signs every installer and writes latest.json, then stops before
  # publishing. Use it to check a change to this file without making a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Windows installer (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            runner: windows-latest
          - arch: x86
            target: i686-pc-windows-msvc
            runner: windows-latest
          - arch: arm64
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The version, and the tag when there is one
        run: |
          $cargo = [regex]::Match((Get-Content src-tauri/Cargo.toml -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($cargo -ne $conf) { throw "Cargo.toml $cargo, tauri.conf.json $conf" }
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}".TrimStart('v')
            if ($tag -ne $cargo) { throw "tag $tag, Cargo.toml $cargo" }
          }

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Test
        working-directory: src-tauri
        run: cargo test --locked --target ${{ matrix.target }}

      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-binstall

      - name: Install Tauri CLI
        run: cargo binstall -y --locked "tauri-cli@2.12.1"

      # Signs the installer for the in-app updater. Add both secrets under Settings > Secrets and variables > Actions.
      - name: Build installer
        working-directory: src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build --target ${{ matrix.target }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux packages (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tauri's Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libgtk-layer-shell-dev librsvg2-dev libssl-dev

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Test
        working-directory: src-tauri
        run: cargo test --locked

      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-binstall

      - name: Install Tauri CLI
        run: cargo binstall -y --locked "tauri-cli@2.12.1"

      # No updater artifacts: Linux updates come from the package manager or a new download.
      - name: Build .deb, .rpm and AppImage
        working-directory: src-tauri
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: cargo tauri build --bundles deb,rpm,appimage --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-${{ matrix.arch }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7

  arch:
    name: Arch package
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: archlinux:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-x64
          path: pkgs

      - name: Build the Arch package from the .deb
        run: |
          pacman -Syu --noconfirm --needed base-devel
          useradd -m builder
          install -d -o builder /home/builder/pkg
          deb=$(ls pkgs/deb/*_amd64.deb)
          version=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          cp "$deb" /home/builder/pkg/
          sed -e "s|^source=.*|source=(\"$(basename "$deb")\")|" -e "s|^pkgver=.*|pkgver=$version|" packaging/arch/PKGBUILD > /home/builder/pkg/PKGBUILD
          chown -R builder /home/builder/pkg
          su builder -c 'cd ~/pkg && makepkg --noconfirm --nodeps'
          mkdir -p out && cp /home/builder/pkg/*.pkg.tar.zst out/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-arch
          path: out/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: [build, linux, arch]
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-*
          path: linux
          merge-multiple: true

      - name: Linux packages next to the installers
        run: |
          Get-ChildItem linux -Recurse -File | Where-Object Name -match '\.(deb|rpm|AppImage|pkg\.tar\.zst)$' | Copy-Item -Destination dist
          foreach ($ext in 'deb', 'rpm', 'AppImage', 'pkg.tar.zst') {
            if (-not (Get-ChildItem dist -Filter "*.$ext")) { throw "no .$ext package" }
          }

      - name: Release notes and latest.json
        run: |
          $version = [regex]::Match((Get-Content src-tauri/Cargo.toml -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          $tag = "v$version"
          "VERSION=$version" >> $env:GITHUB_ENV
          $log = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?ms)^## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=^## \[|\z)")
          if (-not $m.Success) { throw "CHANGELOG.md has no section for $version" }
          $notes = $m.Groups[1].Value.Trim()
          $notes | Set-Content notes.md
          # The feed the in-app updater reads: releases/latest/download/latest.json. Each PC takes
          # the entry for its own architecture.
          $platforms = [ordered]@{}
          foreach ($p in @(@('windows-x86_64', 'x64'), @('windows-i686', 'x86'), @('windows-aarch64', 'arm64'))) {
            $exe = "Sarab_${version}_$($p[1])-setup.exe"
            if (-not (Test-Path "dist/$exe")) { throw "missing dist/$exe" }
            $platforms[$p[0]] = @{ signature = (Get-Content "dist/$exe.sig" -Raw).Trim(); url = "https://github.com/${{ github.repository }}/releases/download/$tag/$exe" }
          }
          @{ version = $version; notes = $notes; pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ'); platforms = $platforms } |
            ConvertTo-Json -Depth 5 | Set-Content latest.json
          Get-Content latest.json
          Get-ChildItem dist | ForEach-Object { "$($_.Name)  $([math]::Round($_.Length / 1MB, 1)) MB" }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.ref_type != 'tag'
        with:
          archive: false
          path: latest.json
          retention-days: 7

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: github.ref_type == 'tag'
        with:
          name: Sarab ${{ env.VERSION }}
          body_path: notes.md
          # A tag like v0.0.7-beta.1 is a prerelease, which the stable feed (releases/latest) skips.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*-setup.exe
            dist/*-setup.exe.sig
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.pkg.tar.zst
            latest.json
          fail_on_unmatched_files: true

      # The beta feed lives on a fixed `beta` release. Every release refreshes it, so the beta
      # channel gets stable releases too.
      - name: Refresh the beta feed
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view beta --repo ${{ github.repository }} *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create beta --repo ${{ github.repository }} --prerelease --title "Beta feed" --notes "The update feed for the beta channel. Install from the versioned releases."
          }
          gh release upload beta latest.json --clobber --repo ${{ github.repository }}

  winget:
    name: Submit to winget
    needs: publish
    # winget gets full releases only.
    if: ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-binstall

      - name: Install Komac
        run: cargo binstall -y --locked "komac@2.16.0"

      # Opens the update pull request on microsoft/winget-pkgs from the maintainer's fork.
      # WINGET_TOKEN is a classic token with the public_repo scope: the workflow's own token
      # cannot open pull requests on another organization's repository.
      - name: Open the winget update pull request
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:GITHUB_TOKEN) {
            "::notice::WINGET_TOKEN is not set, so no winget pull request was opened."
            exit 0
          }
          $version = "${{ github.ref_name }}".TrimStart('v')
          $base = "https://github.com/${{ github.repository }}/releases"
          komac sync
          komac update MKAbuMattar.Sarab --version $version `
            --urls "$base/download/${{ github.ref_name }}/Sarab_${version}_x64-setup.exe" `
                   "$base/download/${{ github.ref_name }}/Sarab_${version}_x86-setup.exe" `
                   "$base/download/${{ github.ref_name }}/Sarab_${version}_arm64-setup.exe" `
            --release-notes-url "$base/tag/${{ github.ref_name }}" `
            --submit
