name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build and checks
    runs-on: windows-latest
    # A normal run takes about 7 minutes. A runner that hangs (as in the 2026-10-05 Actions
    # outage) fails here instead of holding the PR for the default 6 hours.
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --release --locked --all-targets -- -D warnings

      - name: Unit tests
        working-directory: src-tauri
        run: cargo test --locked

      # Desktop checks (embedding, pausing, media) need a real desktop and stay local.
      - name: Static checks
        run: |
          ./scripts/check.ps1 static
          ./scripts/check.ps1 brand

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-binstall

      - name: Install Tauri CLI
        run: cargo binstall -y --locked "tauri-cli@2.12.1"

      # Pull requests cannot read the signing secret, so CI builds without updater signatures.
      - name: Build installer
        working-directory: src-tauri
        run: |
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content ci.conf.json
          cargo tauri build --config ci.conf.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Upload the installer itself, not a zip of it. Needs exactly one file;
          # the artifact is named after it, for example Sarab_0.0.3_x64-setup.exe.
          archive: false
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14

  windows-arch:
    name: Windows ${{ matrix.arch }} build and tests
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            target: i686-pc-windows-msvc
            runner: windows-latest
          - arch: arm64
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Unit tests
        working-directory: src-tauri
        run: cargo test --locked --target ${{ matrix.target }}

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-binstall

      - name: Install Tauri CLI
        run: cargo binstall -y --locked "tauri-cli@2.12.1"

      - name: Build installer
        working-directory: src-tauri
        run: |
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content ci.conf.json
          cargo tauri build --target ${{ matrix.target }} --config ci.conf.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: false
          path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tauri's Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Unit tests
        working-directory: src-tauri
        run: cargo test --locked

  linux-packages:
    name: Linux packages (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tauri's Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev xvfb

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-binstall

      - name: Install Tauri CLI
        run: cargo binstall -y --locked "tauri-cli@2.12.1"

      - name: Build .deb, .rpm and AppImage
        working-directory: src-tauri
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: cargo tauri build --bundles deb,rpm,appimage --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: A wallpaper on the X11 desktop
        if: matrix.arch == 'x64'
        run: |
          sudo apt-get install -y openbox xdotool x11-utils dbus-x11
          bash scripts/check-linux.sh src-tauri/target/release/sarab

      - name: The AppImage starts
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          app=$(ls src-tauri/target/release/bundle/appimage/*.AppImage)
          chmod +x "$app"
          set +e
          xvfb-run -a timeout 20 "$app" --autostart
          code=$?
          set -e
          echo "exit $code"
          test "$code" -eq 124

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: false
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: false
          path: src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: false
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

  linux-install:
    name: Install on ${{ matrix.distro }} (${{ matrix.arch }})
    needs: linux-packages
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Ubuntu
            image: ubuntu:24.04
            arch: x64
            runner: ubuntu-24.04
            deb: amd64
          - distro: Fedora
            image: fedora:42
            arch: x64
            runner: ubuntu-24.04
            rpm: x86_64
          - distro: Arch Linux
            image: archlinux:latest
            arch: x64
            runner: ubuntu-24.04
            deb: amd64
          - distro: Ubuntu
            image: ubuntu:24.04
            arch: arm64
            runner: ubuntu-24.04-arm
            deb: arm64
          - distro: Fedora
            image: fedora:42
            arch: arm64
            runner: ubuntu-24.04-arm
            rpm: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Sarab*
          path: pkgs
          merge-multiple: true

      - name: Install the .deb
        if: matrix.distro == 'Ubuntu'
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ./pkgs/*_${{ matrix.deb }}.deb

      - name: Install the .rpm
        if: matrix.distro == 'Fedora'
        run: dnf install -y ./pkgs/*.${{ matrix.rpm }}.rpm

      - name: Build and install the Arch package
        if: matrix.distro == 'Arch Linux'
        run: |
          pacman -Syu --noconfirm --needed base-devel
          useradd -m builder
          install -d -o builder /home/builder/pkg
          deb=$(ls pkgs/*_${{ matrix.deb }}.deb)
          cp "$deb" /home/builder/pkg/
          sed "s|^source=.*|source=(\"$(basename "$deb")\")|" packaging/arch/PKGBUILD > /home/builder/pkg/PKGBUILD
          chown -R builder /home/builder/pkg
          su builder -c 'cd ~/pkg && makepkg --noconfirm --nodeps'
          pacman -U --noconfirm /home/builder/pkg/*.pkg.tar.zst

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.distro == 'Arch Linux'
        with:
          archive: false
          path: /home/builder/pkg/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14

      - name: Sarab is installed with every library it needs
        run: |
          test -x /usr/bin/sarab
          test -f /usr/share/applications/Sarab.desktop
          missing=$(ldd /usr/bin/sarab | grep "not found" || true)
          echo "${missing:-no missing libraries}"
          test -z "$missing"
