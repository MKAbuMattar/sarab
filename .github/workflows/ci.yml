name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build and checks
    runs-on: windows-latest
    # A normal run takes about 7 minutes. A runner that hangs (as in the 2026-10-05 Actions
    # outage) fails here instead of holding the PR for the default 6 hours.
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --release --locked --all-targets -- -D warnings

      - name: Unit tests
        working-directory: src-tauri
        run: cargo test --locked

      # Desktop checks (embedding, pausing, media) need a real desktop and stay local.
      - name: Static checks
        run: |
          ./scripts/check.ps1 static
          ./scripts/check.ps1 brand

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-binstall

      - name: Install Tauri CLI
        run: cargo binstall -y --locked "tauri-cli@2.12.1"

      # Pull requests cannot read the signing secret, so CI builds without updater signatures.
      - name: Build installer
        working-directory: src-tauri
        run: |
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content ci.conf.json
          cargo tauri build --config ci.conf.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Upload the installer itself, not a zip of it. Needs exactly one file;
          # the artifact is named after it, for example Sarab_0.0.3_x64-setup.exe.
          archive: false
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14

  windows-arch:
    name: Windows ${{ matrix.arch }} build and tests
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            target: i686-pc-windows-msvc
            runner: windows-latest
          - arch: arm64
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Unit tests
        working-directory: src-tauri
        run: cargo test --locked --target ${{ matrix.target }}

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-binstall

      - name: Install Tauri CLI
        run: cargo binstall -y --locked "tauri-cli@2.12.1"

      - name: Build installer
        working-directory: src-tauri
        run: |
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content ci.conf.json
          cargo tauri build --target ${{ matrix.target }} --config ci.conf.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: false
          path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tauri's Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Unit tests
        working-directory: src-tauri
        run: cargo test --locked
