name: Accessibility barrier
description: Something in Sarab is hard or impossible to use with your setup.
labels: ["accessibility", "bug"]
body:
  - type: markdown
    attributes:
      value: |
        Accessibility barriers are bugs. See the [accessibility statement](https://github.com/MKAbuMattar/sarab/blob/main/ACCESSIBILITY.md) for what is supported.
  - type: textarea
    id: task
    attributes:
      label: What were you trying to do?
      placeholder: Change the wallpaper on my second display.
    validations:
      required: true
  - type: textarea
    id: barrier
    attributes:
      label: What got in the way
      description: What happened, or what you could not reach, read or see.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: What you use
      description: For example a screen reader and its version, keyboard only, a Windows contrast theme, text size, display scaling, Arabic.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Sarab and Windows versions
      placeholder: "Sarab 0.0.3, Windows 11 24H2"
