name: Feature request
description: Suggest something Sarab could do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check the [roadmap](https://github.com/MKAbuMattar/sarab/blob/main/ROADMAP.md) first; your idea may already be planned.
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
      description: The situation and the goal, before any solution.
      placeholder: I use two displays and want a different wallpaper at night...
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you imagine it working.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What you do today
      description: Workarounds you use now, if any.
  - type: checkboxes
    id: light
    attributes:
      label: Old PCs
      options:
        - label: I have thought about whether this would make Sarab slower or use more battery.
